server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache long pour les assets buildes (avec hash)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Pas de cache sur favicon ni og.png (pour pouvoir les changer rapidement)
  location ~* /(favicon\.svg|og\.png)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Cache moyen pour les autres assets statiques
  location ~* \.(png|jpg|jpeg|gif|svg|webp|glb|woff2?|ttf)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  # WebSocket vers le serveur Node interne
  location /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
  }

  # HTTP endpoints du serveur Node
  location /api/snapshot {
    proxy_pass http://127.0.0.1:3000/snapshot;
    proxy_set_header Host $host;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 256;
}
